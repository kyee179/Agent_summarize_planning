name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm release:check

      - name: Desktop smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          node scripts/prepare-linux-sandbox.cjs
          xvfb-run -a pnpm smoke:desktop
          xvfb-run -a pnpm smoke:auth

      - name: Desktop smoke (Windows/macOS)
        if: runner.os != 'Linux'
        run: |
          pnpm smoke:desktop
          pnpm smoke:auth

      - name: Build desktop app
        run: pnpm build:desktop --publish never

      - name: Packaged Windows acceptance
        if: runner.os == 'Windows'
        run: pnpm validate:package "release/win-unpacked/Agent Planning Calendar.exe" evaluation/reports/packaged-windows.json

      - name: Download checksums
        run: pnpm release:checksums

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: study-calendar-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/SHA256SUMS.txt
          retention-days: 30

      - name: Upload synthetic evaluation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evaluation-release-${{ matrix.os }}
          path: evaluation/reports/offline.json
          retention-days: 14
